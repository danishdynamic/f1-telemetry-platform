
x-airflow-common: &airflow-common
  image: apache/airflow:2.11.2

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://f1_user:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

  volumes:
    - ./pipelines/airflow/dags:/opt/airflow/dags
    - ./pipelines/airflow/logs:/opt/airflow/logs
    - ./pipelines/airflow/plugins:/opt/airflow/plugins

  user: "50000:0"

  depends_on:
    postgres:
      condition: service_healthy

services:
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname F1 \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "127.0.0.1:8080:8080"

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully
